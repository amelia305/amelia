name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm exec svelte-kit sync

      - name: Type check
        env:
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@ci.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nFAKE\n-----END PRIVATE KEY-----\n"
          PUBLIC_FIREBASE_API_KEY: ci-api-key
          PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
        run: pnpm check

      - name: Test
        env:
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@ci.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nFAKE\n-----END PRIVATE KEY-----\n"
          PUBLIC_FIREBASE_API_KEY: ci-api-key
          PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
        run: pnpm test
